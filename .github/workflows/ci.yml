# CI/CD do AgroSmart (mesmo fluxo do Chave44 e do AlcoolGasolina, mas autocontido: os composes
# dos ambientes ficam neste repositório, em deploy/). Desenho e passo a passo em docs/cicd.md.
#
#   PR            → testes da API (pytest) e do front (lint + build)
#   merge na main → testes → imagens sha-<7> no GHCR (api e web)
#                   → commit na main trocando deploy/prod/compose.yml → o Portainer sobe a produção
#
# Sem homologação: o merge do PR na main é a aprovação da produção.
# Tudo com o GITHUB_TOKEN: nenhum token de outro repositório. Commits feitos por ele não
# disparam workflows, então o commit do deploy-prod não gera um novo ciclo de CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Na main, nunca cancela: dois merges seguidos precisam deixar o deploy no último.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR exige o dono em minúsculas.
  IMAGEM_API: ghcr.io/rodrigo050705/agrosmart-api
  IMAGEM_WEB: ghcr.io/rodrigo050705/agrosmart-web
  APP: agrosmart

jobs:
  testes-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Banco SQLite temporário e dublês para Gemini e Open-Meteo: nada sai do runner.
      - run: pytest --junitxml=resultados-api.xml
        working-directory: back
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-testes-api
          path: back/resultados-api.xml
          if-no-files-found: ignore

  testes-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_teste/agrosmart-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front_teste/agrosmart-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  imagem:
    needs: [testes-api, testes-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: api
            context: .
            dockerfile: back/Dockerfile
          - nome: web
            context: front_teste/agrosmart-web
            dockerfile: front_teste/agrosmart-web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.nome == 'api' && env.IMAGEM_API || env.IMAGEM_WEB }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  deploy-prod:
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A ponta da main (não o commit do merge): pode haver outro commit depois dele.
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: |
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Até 3 tentativas: se outro merge entrar na main entre o checkout e o push, rebase e repete.
          for TENTATIVA in 1 2 3; do
            # api e simulador usam a mesma imagem; o web tem a sua.
            sed -i -e "s|image: ${IMAGEM_API}:.*|image: ${IMAGEM_API}:${TAG}|" \
                   -e "s|image: ${IMAGEM_WEB}:.*|image: ${IMAGEM_WEB}:${TAG}|" deploy/prod/compose.yml
            # Numa reexecução do mesmo commit, o compose já está na tag: nada a fazer.
            if git diff --quiet; then
              echo "deploy/prod/compose.yml já está em ${TAG}."
              exit 0
            fi
            git commit -am "${APP} prod: ${TAG}"
            git push origin HEAD:main && exit 0
            echo "Push recusado (main andou); tentando de novo."
            git reset --hard -q origin/main
            git pull -q --rebase origin main
          done
          echo "::error::Não consegui atualizar deploy/prod/compose.yml na main."
          exit 1

