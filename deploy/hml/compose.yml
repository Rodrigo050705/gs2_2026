name: agrosmart-hml

# Homologação do AgroSmart, acompanhada pelo Portainer (stack de Git, polling).
# Uma porta só: o nginx do "web" serve o front e repassa /api/ para o serviço "api" pela rede
# interna da stack. Ver docs/cicd.md.

services:
  api:
    # Trocada pelo CI (job deploy-hml) a cada merge na main. Não editar à mão, salvo num rollback.
    image: ghcr.io/rodrigo050705/agrosmart-api:sha-0000000
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/agrosmart.db
    # dados: o SQLite. Segredos, um arquivo por chave (GEMINI_API_KEY), dono 1654, chmod 400.
    volumes:
      - dados:/data
      - /etc/docker/containers/agrosmart-hml/segredos:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  simulador:
    # Mesma imagem da API: gera leituras dos sensores (demo) a cada 5 s. Sai quando houver sensores reais.
    image: ghcr.io/rodrigo050705/agrosmart-api:sha-0000000
    restart: unless-stopped
    command: ["python", "/app/iot-simulator/iot_simulator.py", "--url", "http://api:8000/api/v1/telemetria"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    # Trocada pelo CI junto com a da API (sempre a mesma tag).
    image: ghcr.io/rodrigo050705/agrosmart-web:sha-0000000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8092:80"

volumes:
  dados:
