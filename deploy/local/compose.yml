# Override para rodar o compose de PRODUÇÃO na sua máquina, igual ao que o Portainer sobe.
# Só troca o que depende do servidor: as imagens (locais, no lugar das do GHCR) e a pasta de
# segredos (deploy/local/segredos, fora do Git, no lugar de /etc/docker/containers/...).
#
#   docker build -f back/Dockerfile -t agrosmart-api:local .
#   docker build -t agrosmart-web:local front_teste/agrosmart-web
#   docker compose -f deploy/prod/compose.yml -f deploy/local/compose.yml up
#
# Abre em http://localhost:8093. O segredo: um arquivo deploy/local/segredos/GEMINI_API_KEY.

services:
  api:
    image: agrosmart-api:local
    volumes:
      # Relativo à pasta do primeiro arquivo (deploy/prod).
      - ../local/segredos:/run/secrets:ro

  simulador:
    image: agrosmart-api:local

  web:
    image: agrosmart-web:local
