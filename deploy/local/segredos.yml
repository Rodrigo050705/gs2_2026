# Override para rodar o compose de produção na sua máquina COM AS IMAGENS PUBLICADAS no GHCR.
# Só troca a pasta de segredos (deploy/local/segredos, fora do Git) — as imagens são as do
# compose, exatamente como o Portainer sobe.
#
#   docker compose -f deploy/prod/compose.yml -f deploy/local/segredos.yml up    → http://localhost:8093
#
# Para testar imagens construídas localmente, use deploy/local/compose.yml.

services:
  api:
    volumes:
      # Relativo à pasta do primeiro arquivo (deploy/prod).
      - ../local/segredos:/run/secrets:ro

  simulador:
    volumes:
      - ../local/segredos:/run/secrets:ro
