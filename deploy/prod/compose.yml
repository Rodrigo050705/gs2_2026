name: agrosmart-prod

# Produção do AgroSmart no infra.home, acompanhada pelo Portainer (stack de Git, polling).
# Não há homologação: cada merge na main troca as imagens daqui (job deploy-prod do CI).
# Uma porta só: o nginx do "web" serve o front e repassa /api/ para o serviço "api" pela rede
# interna da stack. Ver docs/cicd.md.
#
# Segredos em /etc/docker/containers/agrosmart-prod/segredos, um arquivo por chave, dono 1654,
# chmod 400: GEMINI_API_KEY, ADMIN_USUARIO, ADMIN_SENHA e TELEMETRIA_TOKEN.

services:
  api:
    # Trocada pelo CI (job deploy-prod) a cada merge na main. Não editar à mão, salvo num rollback.
    image: ghcr.io/rodrigo050705/agrosmart-api:sha-b076bef
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/agrosmart.db
    volumes:
      - dados:/data
      - /etc/docker/containers/agrosmart-prod/segredos:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  simulador:
    # Dados de sensores de demonstração. Remova quando houver sensores reais enviando telemetria.
    # Lê o TELEMETRIA_TOKEN dos mesmos segredos para poder enviar leituras à API.
    image: ghcr.io/rodrigo050705/agrosmart-api:sha-b076bef
    restart: unless-stopped
    command: ["python", "/app/iot-simulator/iot_simulator.py", "--url", "http://api:8000/api/v1/telemetria"]
    volumes:
      - /etc/docker/containers/agrosmart-prod/segredos:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    image: ghcr.io/rodrigo050705/agrosmart-web:sha-b076bef
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8093:80"

volumes:
  dados:
