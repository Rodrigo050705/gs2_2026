# Stack local com Docker: builda as imagens a partir do código (para dev/teste).
# A produção (deploy/prod) só puxa as imagens do GHCR.
#
#   docker compose up --build        → http://localhost:8080
#
# back/.env: GEMINI_API_KEY (sem ela tudo funciona, menos o chat), ADMIN_USUARIO/ADMIN_SENHA
# (primeiro login) e TELEMETRIA_TOKEN (simulador).

name: agrosmart-local

services:
  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    env_file:
      - path: back/.env
        required: false
    volumes:
      - dados:/data

  simulador:
    # Mesma imagem da API, outro comando: gera leituras dos sensores a cada 5 s.
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/iot-simulator/iot_simulator.py", "--url", "http://api:8000/api/v1/telemetria"]
    # TELEMETRIA_TOKEN, para a API aceitar as leituras.
    env_file:
      - path: back/.env
        required: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build: front_teste/agrosmart-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  dados:
